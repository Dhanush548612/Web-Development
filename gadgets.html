<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gadgets List</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #fff8f0;
    margin: 0;
    padding: 20px;
  }

  h1 {
    text-align: center;
    color: #d2691e;
  }

  .food-list {
    max-width: 500px;
    margin: 20px auto;
  }

  .food-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #ffffff;
    border: 1px solid #eee;
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 10px;
  }

  .food-name {
    font-size: 18px;
    font-weight: bold;
  }

  .food-price {
    color: #555;
    font-size: 14px;
  }

  .order-btn {
    background-color: #ff6600;
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
  }

  .order-btn:hover {
    background-color: #e65c00;
  }
</style>
</head>
<body>

  <h1>Gadgets List</h1>

  <div class="food-list">

    <div class="food-item">
      <div>
        <div class="food-name">Smartphone</div>
        <div class="food-price">₹15,000</div>
      </div>
      <button class="order-btn" onclick="alert('Smartphone added to order!')">Order</button>
    </div>

    <div class="food-item">
      <div>
        <div class="food-name">Wireless Earbuds</div>
        <div class="food-price">₹1,500</div>
      </div>
      <button class="order-btn" onclick="alert('Wireless Earbuds added to order!')">Order</button>
    </div>

    <div class="food-item">
      <div>
        <div class="food-name">Smart Watch</div>
        <div class="food-price">₹2,500</div>
      </div>
      <button class="order-btn" onclick="alert('Smart Watch added to order!')">Order</button>
    </div>

    <div class="food-item">
      <div>
        <div class="food-name">Power Bank (10000mAh)</div>
        <div class="food-price">₹1,200</div>
      </div>
      <button class="order-btn" onclick="alert('Power Bank added to order!')">Order</button>
    </div>

    <div class="food-item">
      <div>
        <div class="food-name">Bluetooth Speaker</div>
        <div class="food-price">₹1,800</div>
      </div>
      <button class="order-btn" onclick="alert('Bluetooth Speaker added to order!')">Order</button>
    </div>

    <div class="food-item">
      <div>
        <div class="food-name">Laptop</div>
        <div class="food-price">₹45,000</div>
      </div>
      <button class="order-btn" onclick="alert('Laptop added to order!')">Order</button>
    </div>

    <div class="food-item">
      <div>
        <div class="food-name">USB Cable</div>
        <div class="food-price">₹150</div>
      </div>
      <button class="order-btn" onclick="alert('USB Cable added to order!')">Order</button>
    </div>

    <div class="food-item">
      <div>
        <div class="food-name">Wired Headphones</div>
        <div class="food-price">₹400</div>
      </div>
      <button class="order-btn" onclick="alert('Wired Headphones added to order!')">Order</button>
    </div>

    <div class="food-item">
      <div>
        <div class="food-name">Mobile Cover</div>
        <div class="food-price">₹250</div>
      </div>
      <button class="order-btn" onclick="alert('Mobile Cover added to order!')">Order</button>
    </div>

    <div class="food-item">
      <div>
        <div class="food-name">Tablet</div>
        <div class="food-price">₹18,000</div>
      </div>
      <button class="order-btn" onclick="alert('Tablet added to order!')">Order</button>
    </div>

  </div>

</body>
</html>
