<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grocery List</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #fff8f0;
    margin: 0;
    padding: 20px;
  }

  h1 {
    text-align: center;
    color: #d2691e;
  }

  .food-list {
    max-width: 500px;
    margin: 20px auto;
  }

  .food-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #ffffff;
    border: 1px solid #eee;
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 10px;
  }

  .food-name {
    font-size: 18px;
    font-weight: bold;
  }

  .food-price {
    color: #555;
    font-size: 14px;
  }

  .order-btn {
    background-color: #ff6600;
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
  }

  .order-btn:hover {
    background-color: #e65c00;
  }
</style>
</head>
<body>

  <h1>Grocery List</h1>

  <div class="food-list">

    <div class="food-item">
      <div>
        <div class="food-name">Rice (1 kg)</div>
        <div class="food-price">₹60</div>
      </div>
      <button class="order-btn" onclick="alert('Rice added to order!')">Order</button>
    </div>

    <div class="food-item">
      <div>
        <div class="food-name">Wheat Flour (1 kg)</div>
        <div class="food-price">₹45</div>
      </div>
      <button class="order-btn" onclick="alert('Wheat Flour added to order!')">Order</button>
    </div>

    <div class="food-item">
      <div>
        <div class="food-name">Toor Dal (1 kg)</div>
        <div class="food-price">₹120</div>
      </div>
      <button class="order-btn" onclick="alert('Toor Dal added to order!')">Order</button>
    </div>

    <div class="food-item">
      <div>
        <div class="food-name">Sunflower Oil (1 L)</div>
        <div class="food-price">₹150</div>
      </div>
      <button class="order-btn" onclick="alert('Sunflower Oil added to order!')">Order</button>
    </div>

    <div class="food-item">
      <div>
        <div class="food-name">Sugar (1 kg)</div>
        <div class="food-price">₹45</div>
      </div>
      <button class="order-btn" onclick="alert('Sugar added to order!')">Order</button>
    </div>

    <div class="food-item">
      <div>
        <div class="food-name">Tea Powder (250 g)</div>
        <div class="food-price">₹90</div>
      </div>
      <button class="order-btn" onclick="alert('Tea Powder added to order!')">Order</button>
    </div>

    <div class="food-item">
      <div>
        <div class="food-name">Milk (1 L)</div>
        <div class="food-price">₹30</div>
      </div>
      <button class="order-btn" onclick="alert('Milk added to order!')">Order</button>
    </div>

    <div class="food-item">
      <div>
        <div class="food-name">Onion (1 kg)</div>
        <div class="food-price">₹35</div>
      </div>
      <button class="order-btn" onclick="alert('Onion added to order!')">Order</button>
    </div>

    <div class="food-item">
      <div>
        <div class="food-name">Potato (1 kg)</div>
        <div class="food-price">₹25</div>
      </div>
      <button class="order-btn" onclick="alert('Potato added to order!')">Order</button>
    </div>

    <div class="food-item">
      <div>
        <div class="food-name">Salt (1 kg)</div>
        <div class="food-price">₹20</div>
      </div>
      <button class="order-btn" onclick="alert('Salt added to order!')">Order</button>
    </div>

  </div>

</body>
</html>
