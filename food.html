<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Indian Food Menu</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #fff8f0;
    margin: 0;
    padding: 20px;
  }

  h1 {
    text-align: center;
    color: #d2691e;
  }

  .food-list {
    max-width: 500px;
    margin: 20px auto;
  }

  .food-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #ffffff;
    border: 1px solid #eee;
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 10px;
  }

  .food-name {
    font-size: 18px;
    font-weight: bold;
  }

  .food-price {
    color: #555;
    font-size: 14px;
  }

  .order-btn {
    background-color: #ff6600;
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
  }

  .order-btn:hover {
    background-color: #e65c00;
  }
</style>
</head>
<body>

  <h1>Indian Food Menu</h1>

  <div class="food-list">

    <div class="food-item">
      <div>
        <div class="food-name">Butter Chicken</div>
        <div class="food-price">₹250</div>
      </div>
      <button class="order-btn" onclick="alert('Butter Chicken added to order!')">Order</button>
    </div>

    <div class="food-item">
      <div>
        <div class="food-name">Paneer Tikka</div>
        <div class="food-price">₹200</div>
      </div>
      <button class="order-btn" onclick="alert('Paneer Tikka added to order!')">Order</button>
    </div>

    <div class="food-item">
      <div>
        <div class="food-name">Masala Dosa</div>
        <div class="food-price">₹100</div>
      </div>
      <button class="order-btn" onclick="alert('Masala Dosa added to order!')">Order</button>
    </div>

    <div class="food-item">
      <div>
        <div class="food-name">Chicken Biryani</div>
        <div class="food-price">₹220</div>
      </div>
      <button class="order-btn" onclick="alert('Chicken Biryani added to order!')">Order</button>
    </div>

    <div class="food-item">
      <div>
        <div class="food-name">Chole Bhature</div>
        <div class="food-price">₹120</div>
      </div>
      <button class="order-btn" onclick="alert('Chole Bhature added to order!')">Order</button>
    </div>

    <div class="food-item">
      <div>
        <div class="food-name">Gulab Jamun</div>
        <div class="food-price">₹60</div>
      </div>
      <button class="order-btn" onclick="alert('Gulab Jamun added to order!')">Order</button>
    </div>

  </div>

</body>
</html>
